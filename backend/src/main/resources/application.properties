spring.application.name=task-goblin-backend
server.port=${SERVER_PORT:8080}
spring.datasource.url=${TASK_GOBLIN_DB_URL:jdbc:sqlite:task-goblin.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=${TASK_GOBLIN_DDL_AUTO:update}
spring.jpa.show-sql=${TASK_GOBLIN_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
app.cors.allowed-origin=${TASK_GOBLIN_CORS_ALLOWED_ORIGIN:http://localhost:5173}
